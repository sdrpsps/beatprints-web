[project]
name = "beatprints-api"
version = "1.0.1"
description = "HTTP API wrapper for generating BeatPrints-compatible music posters"
readme = "apps/api/README.md"
requires-python = ">=3.14"
license = "CC-BY-NC-SA-4.0"
dependencies = [
    "BeatPrints==1.1.9",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.35.0",
    "deezer-python==7.3.0",
    "qrcode[pil]>=8.2,<9",
]

[project.scripts]
beatprints-api = "beatprints_api.__main__:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/beatprints_api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.black]
target-version = ["py314"]
