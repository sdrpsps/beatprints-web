    <script id="app-bootstrap">
      document.documentElement.setAttribute("data-app-pending", "")
    </script>
    <style>
      html[data-app-pending], html[data-app-pending] body {
        margin: 0;
        background: #f3edf0;
      }
      #app-loading { display: none; }
      html[data-app-pending] #root { display: none; }
      html[data-app-pending] #app-loading {
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #281d29;
        background: #f3edf0;
        font: 600 18px system-ui, sans-serif;
      }
      #app-loading div { text-align: center; }
      #app-loading .app-loading-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #app-loading .app-loading-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      #app-loading .app-loading-spinner {
        width: 20px;
        height: 20px;
        margin-top: 4px;
        color: #6f606a;
        animation: app-loading-spin 1s linear infinite;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .app-loading-spinner { animation: none; }
      }
    </style>
