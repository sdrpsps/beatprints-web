name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked
      - name: Check Python formatting
        run: uv run --locked black --check apps/api/src apps/api/tests
      - name: Run API tests
        run: uv run --locked pytest -q
      - name: Test release automation
        run: python -m unittest discover -s .github/tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check and build frontend
        run: |
          pnpm --filter @beatprints/web lint
          pnpm --filter @beatprints/web build
      - name: Run frontend regression tests
        run: |
          pnpm --filter @beatprints/web test
          pnpm --filter @beatprints/web test:seo
          pnpm --filter @beatprints/web test:i18n
