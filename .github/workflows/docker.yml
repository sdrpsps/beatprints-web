name: Docker

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # PRs validate the primary deployment architecture quickly. Release tags
      # build both images natively and publish their multi-architecture manifest.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","architecture":"amd64"}]}' || '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","architecture":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","architecture":"arm64"}]}') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          # Architecture tags are implementation details consumed only by the
          # manifest job; users receive the familiar version and latest tags.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.title=BeatPrints Web
            org.opencontainers.image.description=Self-hostable BeatPrints music-poster web app and API
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
            BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=beatprints-api-${{ matrix.architecture }}
          # Cache writes make pull requests faster, but a release image is
          # already available once it is pushed, so do not delay release
          # completion uploading a large BuildKit cache.
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,scope=beatprints-api-{0}', matrix.architecture) || '' }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push multi-architecture manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-amd64
          ARM64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-arm64
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "$AMD64_IMAGE" "$ARM64_IMAGE"
