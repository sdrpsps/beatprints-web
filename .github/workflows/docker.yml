name: Docker

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      recover_tag:
        description: "Publish a manifest from existing architecture images for this release tag"
        required: false
        type: string
      rebuild:
        description: "Rebuild both architecture images for recover_tag before recovery"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-release-pr:
    name: Check release PR changes
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version-only: ${{ steps.files.outputs.version-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check changed files
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_release_pr_files.py

  build:
    name: Build ${{ matrix.platform }} image
    needs: check-release-pr
    if: >-
      !cancelled() && (inputs.recover_tag == '' || inputs.rebuild == true) &&
      (needs.check-release-pr.result == 'skipped' ||
       (needs.check-release-pr.result == 'success' && needs.check-release-pr.outputs.version-only != 'true'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # PRs validate the primary deployment architecture quickly. Release tags
      # build both images natively and publish their multi-architecture manifest.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","architecture":"amd64"}]}' || '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","architecture":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","architecture":"arm64"}]}') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild && inputs.recover_tag != '' && inputs.recover_tag || github.sha }}

      - name: Determine image version
        id: build-info
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
          REBUILD: ${{ inputs.rebuild }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          version="0.0.0-dev"
          prefix="dev"
          if [[ "$EVENT" == "workflow_dispatch" && "$REBUILD" == "true" && -n "$RECOVER_TAG" ]]; then
            [[ "$RECOVER_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
            version="$RECOVER_TAG"
            prefix="build"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
            prefix="build"
          fi
          printf 'sha=%s\nversion=%s\nprefix=%s\n' "$sha" "$version" "$prefix" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          # Architecture tags are implementation details consumed only by the
          # manifest job; users receive the familiar version and latest tags.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build-info.outputs.prefix }}-${{ steps.build-info.outputs.sha }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.title=BeatPrints Web
            org.opencontainers.image.description=Self-hostable BeatPrints music-poster web app and API
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build-info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build-info.outputs.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_GIT_SHA=${{ steps.build-info.outputs.sha }}
          cache-from: type=gha,scope=beatprints-api-${{ matrix.architecture }}
          # Cache writes make pull requests faster, but a release image is
          # already available once it is pushed, so do not delay release
          # completion uploading a large BuildKit cache.
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,scope=beatprints-api-{0}', matrix.architecture) || '' }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish multi-architecture image
    if: ${{ !cancelled() && github.event_name != 'pull_request' && inputs.recover_tag == '' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: beatprints-release-publication
      queue: max
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.ref_type != 'tag'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=dev-sha-

      - name: Publish non-release build manifest
        if: github.ref_type != 'tag'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}-amd64
          ARM64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}-arm64
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "$AMD64_IMAGE" "$ARM64_IMAGE"

      - name: Verify image and publish release
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          python3 .github/scripts/publish_release_image.py

  recover-manifest:
    name: Recover release manifest
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.recover_tag != '' &&
      (needs.build.result == 'skipped' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: beatprints-release-publication
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish existing architecture images
        env:
          RELEASE_TAG: ${{ inputs.recover_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          export RELEASE_SHA="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          python3 .github/scripts/publish_release_image.py
