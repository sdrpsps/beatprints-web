name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to refresh (for example v1.4.0)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update Release PR
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out release history
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PR summaries to GitHub Release
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/release_summary.py
